# 发布（docs/design/auto-update.md §11）：各平台 AOT 发布与打包 → 生成并签名 manifest.json → 创建 Release。
# 两种触发方式：
#   - 推送 v* tag：创建 draft Release，人工检查后再点 Publish（发布前客户端看不到 draft）；tag 带 '-'（v1.2.0-beta.1）的是预发布版本。
#   - 手动运行（workflow_dispatch）：指定版本号与是否预发布，直接在当前提交上创建 tag 并发布。
# StreamMark（AtomUICommunity/StreamMark，子模块 external/StreamMark）以本地 NuGet 包引用：先按 RID 构建 RaTeX 原生库，再统一打包。
#
# macOS 需要签名与公证凭据；没有配置这些 secrets 时跳过 macOS，只发布 Windows 与 Linux：
#   MACOS_APP_CERT_P12（Developer ID Application，base64）、MACOS_CERT_PASSWORD、
#   APPLE_ID、APPLE_APP_SPECIFIC_PASSWORD（appleid.apple.com 生成的 App 专用密码）、APPLE_TEAM_ID
# 清单签名私钥：UPDATE_SIGNING_KEY（PEM，tools/release/gen-update-key.sh 生成）。
name: release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（不带 v，例如 0.1.0）
        required: true
      prerelease:
        description: 预发布版本（GitHub Pre-release）
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      draft: ${{ steps.v.outputs.draft }}
      macos: ${{ steps.v.outputs.macos }}
    steps:
      - id: v
        env:
          HAS_MACOS: ${{ secrets.MACOS_APP_CERT_P12 != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
          HAS_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            prerelease="$INPUT_PRERELEASE"
            draft=false
          else
            version="${GITHUB_REF_NAME#v}"
            case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
            draft=true
          fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::invalid version $version"; exit 1; }
          { echo "version=$version"; echo "tag=v$version"; echo "prerelease=$prerelease"; echo "draft=$draft"; } >> "$GITHUB_OUTPUT"
          echo "macos=$HAS_MACOS" >> "$GITHUB_OUTPUT"
          if [ "$HAS_MACOS" != "true" ]; then echo "::warning::macOS signing secrets are not configured; skipping macOS."; fi
          if [ "$HAS_KEY" != "true" ]; then echo "::error::UPDATE_SIGNING_KEY is not configured."; exit 1; fi

  # StreamMark 的 RaTeX 原生库：各 RID 在原生 runner 上构建（与 StreamMark 自己的 CI 相同）
  streammark-native:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-2022 }
          - { rid: linux-x64, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: external/StreamMark/native/build.sh ${{ matrix.rid }}
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: external/StreamMark/native/build.ps1 -Rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: ratex-${{ matrix.rid }}
          path: external/StreamMark/artifacts/native/${{ matrix.rid }}/
          if-no-files-found: error

  streammark-native-macos:
    needs: setup
    if: needs.setup.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64, os: macos-15 }
          - { rid: osx-x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: external/StreamMark/native/build.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: ratex-${{ matrix.rid }}
          path: external/StreamMark/artifacts/native/${{ matrix.rid }}/
          if-no-files-found: error

  # 把 StreamMark 打成本地 NuGet 包（版本取 Directory.Packages.props 的 StreamMarkVersion），RaTeX 包内含各 RID 的原生库
  streammark-pack:
    needs: [ setup, streammark-native, streammark-native-macos ]
    if: always() && needs.streammark-native.result == 'success' && (needs.streammark-native-macos.result == 'success' || needs.streammark-native-macos.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          # AtomUI 6.2.6 的独立构建工具需要 .NET 10 Runtime；实际构建 SDK 由 global.json 选择 .NET 11。
          dotnet-version: 10.0.x
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          pattern: ratex-*
          path: external/StreamMark/artifacts/native
      - name: Pack
        run: |
          # download-artifact 按 artifact 名建子目录：ratex-<rid> → <rid>
          cd external/StreamMark/artifacts/native
          for d in ratex-*; do mv "$d" "${d#ratex-}"; done
          ls -R .
          cd "$GITHUB_WORKSPACE"
          version="$(sed -n 's:.*<StreamMarkVersion>\(.*\)</StreamMarkVersion>.*:\1:p' Directory.Packages.props)"
          for project in Core Avalonia RaTeX Highlighting.TextMate Mermaid; do
            dotnet pack "external/StreamMark/src/StreamMark.$project" -c Release -o packages/streammark -p:Version="$version" --nologo -v quiet
          done
          ls packages/streammark
      - uses: actions/upload-artifact@v4
        with:
          name: streammark-packages
          path: packages/streammark/*.nupkg
          if-no-files-found: error

  # 原生库（与 terminal.yml 相同）：Linux runner 用 zig 交叉编译 linux / windows；macOS 目标需要 Apple SDK
  native-linux:
    needs: setup
    runs-on: ubuntu-24.04
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-global
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q llvm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tkcode/zig
            ${{ github.workspace }}/.zig-cache-global
          key: zig-linux-${{ hashFiles('native/toolchain.json') }}
      - run: native/tkcodepty/build.sh linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: |
            artifacts/native/*/*tkcodepty.*
            artifacts/native/*/tkcode-pty-spawn
          if-no-files-found: error

  native-macos:
    needs: setup
    if: needs.setup.outputs.macos == 'true'
    runs-on: macos-15
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-global
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tkcode/zig
            ${{ github.workspace }}/.zig-cache-global
          key: zig-macos-${{ hashFiles('native/toolchain.json') }}
      - run: for rid in osx-arm64 osx-x64; do native/tkcodepty/build.sh "$rid"; done
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: |
            artifacts/native/*/*tkcodepty.*
            artifacts/native/*/tkcode-pty-spawn
          if-no-files-found: error

  windows:
    needs: [ setup, native-linux, streammark-pack ]
    if: always() && needs.native-linux.result == 'success' && needs.streammark-pack.result == 'success'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # AtomUI 6.2.6 的独立构建工具需要 .NET 10 Runtime；实际构建 SDK 由 global.json 选择 .NET 11。
          dotnet-version: 10.0.x
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: artifacts/native
      - uses: actions/download-artifact@v4
        with:
          name: streammark-packages
          path: packages/streammark
      - name: AOT publish (0 IL warnings)
        shell: bash
        run: |
          set -o pipefail
          dotnet publish src/TKCode.Desktop/TKCode.Desktop.csproj -c Release -r win-x64 -p:Version=${{ needs.setup.outputs.version }} -o artifacts/publish/win-x64 2>&1 | tee publish.log
          if grep -E 'warning IL[0-9]{4}' publish.log; then echo "::error::AOT/trim warnings"; exit 1; fi
      - name: Smoke test
        shell: bash
        run: |
          [ "$(artifacts/publish/win-x64/TKCode.exe --version | cut -d' ' -f1)" = "${{ needs.setup.outputs.version }}" ]
          artifacts/publish/win-x64/agenthost/TKCode.AgentHost.exe --self-test
          artifacts/publish/win-x64/ptyhost/tkcode-ptyhost.exe --self-test
          artifacts/publish/win-x64/TKCode.exe --smoke --out=artifacts/smoke-win-x64.png
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ needs.setup.outputs.version }} `
            /DSourceDir="$PWD\artifacts\publish\win-x64" /DOutputDir="$PWD\dist" src\TKCode.Desktop\Packaging\windows\TKCode.iss
      - uses: actions/upload-artifact@v4
        with:
          name: dist-win-x64
          path: dist/*
          if-no-files-found: error

  linux:
    needs: [ setup, native-linux, streammark-pack ]
    if: always() && needs.native-linux.result == 'success' && needs.streammark-pack.result == 'success'
    # 较早的 glibc：AOT 二进制链接到构建机的 glibc，原生库的下限是 2.28（terminal.yml）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # AtomUI 6.2.6 的独立构建工具需要 .NET 10 Runtime；实际构建 SDK 由 global.json 选择 .NET 11。
          dotnet-version: 10.0.x
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: artifacts/native
      - uses: actions/download-artifact@v4
        with:
          name: streammark-packages
          path: packages/streammark
      - run: chmod +x artifacts/native/*/tkcode-pty-spawn
      - name: AOT publish (0 IL warnings)
        run: |
          set -o pipefail
          dotnet publish src/TKCode.Desktop/TKCode.Desktop.csproj -c Release -r linux-x64 -p:Version=${{ needs.setup.outputs.version }} -o artifacts/publish/linux-x64 2>&1 | tee publish.log
          if grep -E 'warning IL[0-9]{4}' publish.log; then echo "::error::AOT/trim warnings"; exit 1; fi
      - name: Smoke test
        run: |
          [ "$(artifacts/publish/linux-x64/TKCode --version | cut -d' ' -f1)" = "${{ needs.setup.outputs.version }}" ]
          artifacts/publish/linux-x64/agenthost/TKCode.AgentHost --self-test
          artifacts/publish/linux-x64/ptyhost/tkcode-ptyhost --self-test
          artifacts/publish/linux-x64/TKCode --smoke --out=artifacts/smoke-linux-x64.png
      - run: tools/release/package-linux.sh artifacts/publish/linux-x64 ${{ needs.setup.outputs.version }} linux-x64 dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x64
          path: dist/*
          if-no-files-found: error

  macos:
    needs: [ setup, native-macos, streammark-pack ]
    if: always() && needs.native-macos.result == 'success' && needs.streammark-pack.result == 'success'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        rid: [ osx-arm64, osx-x64 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # AtomUI 6.2.6 的独立构建工具需要 .NET 10 Runtime；实际构建 SDK 由 global.json 选择 .NET 11。
          dotnet-version: 10.0.x
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: native-macos
          path: artifacts/native
      - uses: actions/download-artifact@v4
        with:
          name: streammark-packages
          path: packages/streammark
      - run: chmod +x artifacts/native/*/tkcode-pty-spawn
      - name: Import signing certificate
        env:
          APP_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpass="$(uuidgen)"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          echo "$APP_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain"
          # shellcheck disable=SC2046  # 原有的 keychain 列表按空白拆开
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "MACOS_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')" >> "$GITHUB_ENV"
      - name: Build and sign TKCode.app (0 IL warnings)
        run: |
          set -o pipefail
          tools/package_macos_app.sh ${{ matrix.rid }} artifacts ${{ needs.setup.outputs.version }} 2>&1 | tee publish.log
          if grep -E 'warning IL[0-9]{4}' publish.log; then echo "::error::AOT/trim warnings"; exit 1; fi
      - name: Smoke test
        if: matrix.rid == 'osx-arm64'
        run: |
          [ "$(artifacts/TKCode.app/Contents/MacOS/TKCode --version | cut -d' ' -f1)" = "${{ needs.setup.outputs.version }}" ]
          artifacts/TKCode.app/Contents/MacOS/agenthost/TKCode.AgentHost --self-test
          artifacts/TKCode.app/Contents/MacOS/ptyhost/tkcode-ptyhost --self-test
          artifacts/TKCode.app/Contents/MacOS/TKCode --smoke --out=artifacts/smoke-osx-arm64.png
      - name: Notarize, zip + dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: tools/release/package-macos.sh artifacts/TKCode.app ${{ needs.setup.outputs.version }} ${{ matrix.rid }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [ setup, windows, linux, macos ]
    # macOS 被跳过（没有凭据）时仍然发布 Windows 与 Linux
    if: always() && needs.windows.result == 'success' && needs.linux.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          key="$RUNNER_TEMP/update-signing-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          python3 -I tools/release/make-manifest.py --version ${{ needs.setup.outputs.version }} --dir dist --key "$key" \
            ${{ needs.setup.outputs.prerelease == 'true' && '--prerelease' || '' }}
          rm "$key"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 手动运行时 tag 不存在，gh 在当前提交（--target）上创建
          gh release create "${{ needs.setup.outputs.tag }}" dist/* --target "$GITHUB_SHA" --title "TKCode ${{ needs.setup.outputs.version }}" --generate-notes \
            ${{ needs.setup.outputs.draft == 'true' && '--draft' || '' }} ${{ needs.setup.outputs.prerelease == 'true' && '--prerelease' || '' }}
