# 终端组件（docs/terminal）的 CI：原生库（libtkcodepty；libghostty-vt 随 TKCode.Arc.Terminal 包发布）→ 三平台测试 → AOT 发布与自检。
# 原生库在 Linux 上用 zig 交叉编译 linux / windows 目标；macOS 目标需要 Apple SDK，在 macOS runner 上构建。
name: terminal

on:
  push:
    branches: [main]
    paths: [ "src/TKCode.Terminal.**", "tests/TKCode.Terminal.**", "src/TKCode.Shell/**", "tests/TKCode.Shell.Tests/**", "native/**", "tools/terminal/**", ".github/workflows/terminal.yml", "Directory.*.props", "global.json" ]
  pull_request:
    paths: [ "src/TKCode.Terminal.**", "tests/TKCode.Terminal.**", "src/TKCode.Shell/**", "tests/TKCode.Shell.Tests/**", "native/**", "tools/terminal/**", ".github/workflows/terminal.yml", "Directory.*.props", "global.json" ]
  workflow_dispatch:
  # 每晚：PTY 压力测试按文档规模（03 §14 T10–T14），差分测试扫 200 个种子，结构化 fuzz 跑 20 分钟
  schedule:
    - cron: "17 19 * * *"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  native:
    name: native (${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            os: ubuntu-24.04
            pty_rids: linux-x64 linux-arm64
          - host: macos
            os: macos-15
            pty_rids: osx-arm64 osx-x64
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-global
    steps:
      - uses: actions/checkout@v4
      - name: Install llvm-strip
        if: matrix.host == 'linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q llvm
      - name: Cache Zig toolchain and packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tkcode/zig
            ${{ github.workspace }}/.zig-cache-global
          key: zig-${{ matrix.host }}-${{ hashFiles('native/toolchain.json') }}
      - name: Build libtkcodepty and spawn helper
        run: for rid in ${{ matrix.pty_rids }}; do native/tkcodepty/build.sh "$rid"; done
      - name: Check Linux glibc floor (2.28)
        if: matrix.host == 'linux'
        run: |
          for f in artifacts/native/linux-*/lib*.so; do
            max=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$f requires $max"
            [ "$(printf '%s\nGLIBC_2.28\n' "$max" | sort -V | tail -1)" = "GLIBC_2.28" ]
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.host }}
          path: |
            artifacts/native/*/*tkcodepty.*
            artifacts/native/*/tkcode-pty-spawn
          if-no-files-found: error

  test:
    name: test (${{ matrix.rid }})
    needs: native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
          - os: windows-2022
            rid: win-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: true
      - name: Restore executable bits
        if: runner.os != 'Windows'
        run: chmod +x artifacts/native/*/tkcode-pty-spawn
      - name: Install vim (self-test exercises a full-screen program)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q vim
      - name: Test core
        run: dotnet test tests/TKCode.Terminal.Core.Tests
        env:
          TKCODE_DIFF_SEEDS: ${{ github.event_name == 'schedule' && '200' || '' }}
          TKCODE_FUZZ_MINUTES: ${{ github.event_name == 'schedule' && '20' || '' }}
      - name: Test PTY
        run: dotnet test tests/TKCode.Terminal.Pty.Tests --logger "console;verbosity=normal"
        env:
          TKCODE_PTY_STRESS: ${{ github.event_name == 'schedule' && '1' || '' }}
      - name: Test protocol
        run: dotnet test tests/TKCode.Terminal.Protocol.Tests
      - name: Test shell detection (Windows rules run on every OS; the real file system only here)
        run: dotnet test tests/TKCode.Shell.Tests
      - name: Test pty host (end to end)
        run: dotnet test tests/TKCode.Terminal.Host.Tests
      - name: Test view (headless snapshots)
        run: dotnet test tests/TKCode.Terminal.Avalonia.Tests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.rid }}
          path: artifacts/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots-${{ matrix.rid }}
          path: tests/TKCode.Terminal.Avalonia.Tests/bin/Debug/net11.0/snapshots/
          if-no-files-found: ignore
      - name: AOT publish tkcode-ptyhost (0 IL warnings)
        shell: bash
        run: |
          dotnet publish src/TKCode.Terminal.Host -c Release -r ${{ matrix.rid }} -o artifacts/publish/ptyhost 2>&1 | tee publish.log
          if grep -E 'warning IL[0-9]{4}' publish.log; then echo "::error::AOT/trim warnings"; exit 1; fi
      - name: Check ConPTY publish layout (03 §14 W-T6)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          d=artifacts/publish/ptyhost
          need="conpty.dll arm64/OpenConsole.exe"
          [ "${{ matrix.rid }}" = win-x64 ] && need="$need x64/OpenConsole.exe"
          for f in $need; do [ -f "$d/$f" ] || { echo "::error::missing $f"; exit 1; }; done
      - name: Discovery tests against the AOT host (04 §15)
        shell: bash
        run: dotnet test tests/TKCode.Terminal.Host.Tests --filter "FullyQualifiedName~DiscoveryTests"
        env:
          TKCODE_PTYHOST_DIR: ${{ github.workspace }}/artifacts/publish/ptyhost
      - name: Run AOT self-test
        shell: bash
        run: artifacts/publish/ptyhost/tkcode-ptyhost --self-test

  # esctest2（11 §1.1.4）：真实 PTY + 一致性测试模式的核心。新增失败（单独重跑仍失败）阻断；已知失败见 known-failures.txt
  esctest:
    name: esctest2 (linux-x64)
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: true
      - name: Restore executable bits
        run: chmod +x artifacts/native/*/tkcode-pty-spawn
      - name: Fetch esctest2 (pinned, sha256 checked)
        id: fetch
        run: echo "dir=$(tools/terminal/fetch-esctest.sh)" >> "$GITHUB_OUTPUT"
      - name: Run esctest2
        run: |
          dotnet run --project tools/terminal/EscTestRunner -c Release -- \
            --esctest "${{ steps.fetch.outputs.dir }}" \
            --known tests/TKCode.Terminal.Core.Tests/EscTest/known-failures.txt \
            --log artifacts/esctest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esctest-log
          path: artifacts/esctest.log*
          if-no-files-found: ignore
